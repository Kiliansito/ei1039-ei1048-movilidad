name: Compilar memoria LaTeX

on:
  push:
    branches: [main]
    paths:
      - 'entrega1/01_Memoria/**'
      - 'entrega1/03_Mockups/**'
      - '.github/workflows/documento.yml'
  pull_request:
    paths:
      - 'entrega1/01_Memoria/**'
      - 'entrega1/03_Mockups/**'
      - '.github/workflows/documento.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latex:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener fuentes
        uses: actions/checkout@v4
      - name: Instalar LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-lang-spanish
      - name: Compilar memoria
        working-directory: entrega1/01_Memoria
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error Informe_Entrega1_Via.tex
          pdflatex -interaction=nonstopmode -halt-on-error Informe_Entrega1_Via.tex
      - name: Publicar PDF de esta versión
        uses: actions/upload-artifact@v4
        with:
          name: Entrega1-PDF-LaTeX
          path: entrega1/01_Memoria/Informe_Entrega1_Via.pdf
          if-no-files-found: error
